# Configuración para usar Alembic desde la terminal (el backend migra solo al arrancar).
#   .\.venv\Scripts\python.exe -m alembic revision -m "descripcion"
#   .\.venv\Scripts\python.exe -m alembic downgrade -1
[alembic]
script_location = src/core/database/migrations
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s
